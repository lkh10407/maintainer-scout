[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "maintainer-scout"
version = "0.1.0"
description = "A lightweight CLI that audits open-source repository maintenance signals."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Daegyu Lee" }
]
keywords = ["open-source", "maintenance", "cli", "github", "audit"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Utilities"
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6"
]

[project.urls]
Homepage = "https://github.com/lkh10407/maintainer-scout"
Issues = "https://github.com/lkh10407/maintainer-scout/issues"

[project.scripts]
maintainer-scout = "maintainer_scout.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
